secrets:
    MONGO_USER_PW:
        file: lib/secrets/MONGO_ROOT_PW
    MAIL_CONFIG:
        file: lib/secrets/MAIL_CONFIG
    JWT_CERT:
        file: lib/secrets/certs/auth.crt
    JWT_KEY:
        file: lib/secrets/keys/auth.key

##########################################
volumes:
    auth-vol:
        name: auth-vol
    mongo-data:
        name: mongo-data

##########################################
services:
    auth:
        build:
            context: ./
            dockerfile: Dockerfile.dev.api
        restart: unless-stopped
        container_name: auth-backend
        environment:
            MODE: DEVELOPMENT
            FRONTEND_HOST: "http://localhost:4200" # HOST con protocollo, porta e prefix
            TZ: Europe/Rome
            MONGO_USER: root
            MONGO_DB: auth
            MONGO_HOST: mongo:27017
            REGISTRATION_BEHAVIOUR: "ALLOW_ANYBODY"
        ports:
            - 9081:8000
        volumes:
            - ./api:/app
        secrets:
            - MAIL_CONFIG
            - MONGO_USER_PW
            - JWT_CERT
            - JWT_KEY

    mongo:
        image: mongo:8
        container_name: mongo
        restart: unless-stopped
        environment:
            MONGO_INITDB_ROOT_USERNAME: root
            MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/MONGO_USER_PW
        ports:
            - 27017:27017
        secrets:
            - MONGO_USER_PW
        volumes:
            - mongo-data:/data/db
