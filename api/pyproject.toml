[project]
name = "auth-app"
version = "1.3.0"
description = "auth app backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "argon2-cffi>=25.1.0",
    "asyncio>=4.0.0",
    "bcrypt>=5.0.0",
    "cryptography>=46.0.3",
    "fastapi[standard]>=0.128.0",
    "httpx>=0.28.1",
    "icecream>=2.1.10",
    "pyjwt>=2.10.1",
    "pymongo>=4.16.0",
]


[tool.ruff.lint]
ignore = [
    "E501",
    # line too long
    "E266",
    # too many leading '#' for block comment
    "F403",
    # 'from module import *' used; unable to detect undefined names
    "E731",
    # do not assign a lambda expression, use a definition   instead
    
]
